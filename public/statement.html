<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owner statement · Ownermint</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/css/app.css">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='44' fill='%232fd3a0'/></svg>">
<style>.page { min-height: 100vh; padding: 40px 0 80px; background: radial-gradient(900px 500px at 50% -10%, #cdf5e6, transparent), var(--bg); } .page .wrap { max-width: 920px; perspective: 1600px; } #view { transform-style: preserve-3d; }</style>
</head>
<body>
<div class="page"><div class="wrap">
  <div class="no-print" style="display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;gap:10px">
    <a class="logo" href="/" style="font-size:19px"><i style="width:24px;height:24px"></i>Ownermint</a>
    <button class="btn btn-ghost btn-sm" id="printBtn" type="button"><span>⤓ Save as PDF</span></button>
  </div>
  <div id="view" aria-live="polite"><div class="st-loading"><span class="spinner" aria-hidden="true"></span>Loading statement…</div></div>
</div></div>
<script type="module">
import { renderStatement } from "/js/view.js";
import { cursor, tilt } from "/js/fx.js";
cursor({ subtle: true });
document.getElementById("printBtn").addEventListener("click", () => print());
const view = document.getElementById("view");
const message = (title, text, action) => { view.innerHTML = ""; const box = document.createElement("div"); box.className = "st st-msg"; const h = document.createElement("h2"); h.textContent = title; const p = document.createElement("p"); p.textContent = text; box.append(h, p); if (action) box.appendChild(action); view.appendChild(box); return box; };
const signInBtn = (label = "Sign in with Google") => { const a = document.createElement("a"); a.className = "btn btn-mint"; a.href = "/login?next=" + encodeURIComponent(location.pathname); const s = document.createElement("span"); s.textContent = label; a.appendChild(s); return a; };
const id = location.pathname.split("/").filter(Boolean)[1] || "";
try {
  const res = await fetch(`/api/statements/${encodeURIComponent(id)}`);
  if (res.status === 401) message("Sign in to view this statement", "Your host shared this statement with your email address. Sign in with the Google account for that email to open it.", signInBtn());
  else if (res.status === 403) {
    const d = await res.json().catch(() => ({}));
    const out = document.createElement("div"); out.style.cssText = "display:flex;gap:10px;flex-wrap:wrap";
    const sw = document.createElement("button"); sw.type = "button"; sw.className = "btn btn-mint"; sw.innerHTML = "<span>Use a different Google account</span>";
    sw.onclick = async () => { await fetch("/api/auth/logout", { method: "POST" }).catch(() => {}); location.href = "/login?next=" + encodeURIComponent(location.pathname); };
    out.appendChild(sw);
    message("This statement was shared with someone else", `You're signed in as ${d.signedInAs || "a different account"}, but this statement was shared with a different email address. Sign in with the Google account for the email your host sent it to, or ask them to share it with this one.`, out);
  }
  else if (res.status === 410) message("This link has expired", "Owner links work for 30 days after they're made. Ask your host to send you a new link.");
  else if (res.status === 404) message("Statement not found", "This link may have been mistyped, or the host may have deleted it. Ask them for a new link.");
  else if (!res.ok) message("Couldn't load this statement", `The server returned an error (${res.status}). Please try again in a minute.`);
  else { const data = await res.json(); renderStatement(view, data); document.title = `${data.statement.listing} · Owner statement`; tilt(view, document.body, 2.5); }
} catch { message("Couldn't load this statement", "Check your internet connection and reload the page."); }
</script>
</body>
</html>
